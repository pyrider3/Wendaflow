name: 功能建议
description: 提议新的使用场景或改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你遇到的问题
      description: 请先描述问题，而不只是描述按钮或界面。
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 希望如何解决
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 你尝试过的替代方式
  - type: textarea
    id: context
    attributes:
      label: 补充信息

