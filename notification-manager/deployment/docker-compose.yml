services:
  api:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    restart: unless-stopped
    environment:
      PORT: 8788
      DATABASE_URL: postgresql://wendaflow:${POSTGRES_PASSWORD}@postgres:5432/wendaflow
      WENDAFLOW_ADMIN_TOKEN: ${WENDAFLOW_ADMIN_TOKEN}
      WENDAFLOW_LICENSE_SECRET: ${WENDAFLOW_LICENSE_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8788:8788"
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: wendaflow
      POSTGRES_USER: wendaflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wendaflow -d wendaflow"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  postgres_data:
